name: Keep bot awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://akenz-md.bonto.run/health") && [ "$code" = "200" ] && break
            sleep 10
          done
          echo "health ping finished (last status: $code)"
